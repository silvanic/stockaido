<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="leaf" class="app-icon"></ion-icon>
      {{ 'home.title' | translate }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button [attr.aria-label]="themeToggleAriaLabel()" (click)="cycleTheme()">
        <ion-icon slot="icon-only" [name]="themeIcon()"></ion-icon>
      </ion-button>
      <ion-button [attr.aria-label]="toBuyAriaLabel()" (click)="openToBuyModal()">
        <span class="icon-badge-wrapper" slot="icon-only">
          <ion-icon name="cart-outline"></ion-icon>
          <span class="to-buy-count" *ngIf="toBuyList().length > 0">{{ toBuyList().length }}</span>
        </span>
      </ion-button>
      <ion-button [attr.aria-label]="'optionsMenu.title' | translate" (click)="openOptionsModal()">
        <ion-icon slot="icon-only" name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar *ngIf="showSearch()">
    <ion-searchbar
      [placeholder]="'home.searchPlaceholder' | translate"
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
      [debounce]="150"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Loading state -->
  <ion-spinner *ngIf="loading()"></ion-spinner>

  <!-- Error message -->
  <ion-card *ngIf="error() as err" color="danger">
    <ion-card-header>
      <ion-card-title>{{ 'home.error' | translate }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>{{ err }}</ion-card-content>
  </ion-card>

  <!-- Food groups by location, triés alphabétiquement -->
  <div *ngIf="hasVisibleFoods(); else emptyState">
    <app-location-section
      *ngFor="let group of getLocationGroups(); trackBy: trackByLocationId"
      [group]="group"
      [searchActive]="searchQuery.trim().length > 0"
      (editFood)="openEditForm($event)"
      (toggleFavoriteFood)="toggleFavorite($event)"
      (incrementFood)="incrementQuantity($event)"
      (decrementFood)="decrementQuantity($event)"
      (deleteFood)="deleteFood($event)"
    ></app-location-section>
  </div>

  <!-- Empty state -->
  <ng-template #emptyState>
    <div class="empty-state">
      <ion-icon name="cube-outline"></ion-icon>
      <h2>{{ 'home.emptyTitle' | translate }}</h2>
      <p>{{ 'home.emptyText' | translate }}</p>
    </div>
  </ng-template>
</ion-content>

<ion-footer class="add-footer">
  <div class="add-button-bar">
    <ion-button expand="block" class="add-button" (click)="toggleAddForm()">
      <ion-icon name="add-circle" slot="start"></ion-icon>
      {{ 'home.addFood' | translate }}
    </ion-button>
  </div>
</ion-footer>
