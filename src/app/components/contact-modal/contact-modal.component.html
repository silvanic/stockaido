<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onClose()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'contactModal.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content>
      <ion-note *ngIf="contactError" color="danger" class="error-note">{{ contactError }}</ion-note>
      <ion-note class="empty-note">{{ 'contactModal.description' | translate }}</ion-note>

      <form (ngSubmit)="send()" class="contact-form">
        <ion-item class="field-item">
          <ion-label position="floating">{{ 'contactModal.message' | translate }}</ion-label>
          <ion-textarea
            [(ngModel)]="message"
            name="message"
            [maxlength]="maxMessageLength"
            [autoGrow]="true"
            rows="4"
          ></ion-textarea>
        </ion-item>

        <ion-item class="field-item">
          <ion-label position="floating">{{ 'contactModal.email' | translate }}</ion-label>
          <ion-input [(ngModel)]="email" name="email" type="email"></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" [disabled]="sendLoading || !message.trim()">
          <ion-spinner name="crescent" *ngIf="sendLoading"></ion-spinner>
          <span *ngIf="!sendLoading">{{ 'contactModal.send' | translate }}</span>
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
