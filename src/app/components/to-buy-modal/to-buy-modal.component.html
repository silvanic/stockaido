<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'home.toBuy' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onClose()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let food of toBuyList()" button (click)="openEditForm(food)">
      <ion-label>
        <h2>{{ food.name }}</h2>
        <p>{{ food.quantity }} / {{ food.minimalStock }} {{ getUnitLabel(food.unit) | translate }}</p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="toBuyList().length === 0">
      <ion-label>{{ 'home.toBuyEmpty' | translate }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
